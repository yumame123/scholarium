<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Character Mapper - Nightfall -</title>
    <style>
        :root {
            --bg-color: #080a12;
            --grid-color: rgba(255, 255, 255, 0.03);
            --room-bg: rgba(20, 25, 45, 0.4);
            --room-border: #2a3250;
            --room-hover: rgba(40, 50, 80, 0.6);
            --text-main: #b8c0d8;
            --text-muted: #626c8a;
            --accent-gold: #c2a878;
            --accent-purple: #6a4c93;
            --accent-red: #c27878;
            --accent-blue: #789bc2;
            --accent-green: #78c28a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Yu Mincho', 'Sawarabi Mincho', 'Hiragino Mincho ProN', serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header & Floor Selector */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(8,10,18,1), rgba(8,10,18,0));
            z-index: 10;
        }

        /* 学校名（編集可能） */
        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(184, 192, 216, 0.2);
            padding: 5px 10px;
            border-bottom: 1px dashed transparent;
            transition: border-color 0.3s;
            cursor: text;
        }

        h1:hover, h1:focus {
            border-color: var(--text-muted);
            outline: none;
        }

        .floor-selector select {
            background: transparent;
            border: 1px solid var(--room-border);
            color: var(--accent-gold);
            padding: 5px 10px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .floor-selector select option {
            background: var(--bg-color);
            color: var(--text-main);
        }

        /* Map Container */
        .map-wrapper {
            flex: 1;
            position: relative;
            overflow: auto; /* スマホではスクロール可能に */
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-container {
            width: 100%;
            min-width: 800px; /* レイアウト崩れ防止 */
            height: 80%;
            min-height: 400px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 1fr 60px 1fr; /* 上段教室、中央廊下、下段教室 */
            gap: 4px;
        }

        .room {
            background: var(--room-bg);
            border: 1px solid var(--room-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .room.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .room:not(.empty):hover {
            background: var(--room-hover);
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(194, 168, 120, 0.1);
        }

        .room.special {
            border-color: rgba(106, 76, 147, 0.6);
        }

        .room-name {
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 5px;
        }

        .char-count {
            font-size: 0.7rem;
            color: var(--accent-gold);
            margin-top: 4px;
            opacity: 0.8;
        }

        .hallway {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.01);
            border-top: 1px dashed var(--room-border);
            border-bottom: 1px dashed var(--room-border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 8px;
        }

        /* Floating Wisps (Characters) */
        .wisp-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            transition: top 5s ease-in-out, left 5s ease-in-out;
            transform: translate(-50%, -50%); /* 中央揃え */
        }

        .wisp-name {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 3px #000, 0 0 5px rgba(0,0,0,0.8);
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .wisp {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0.8;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        /* FAB (Add Button) */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(194, 168, 120, 0.3);
            transition: transform 0.2s;
            z-index: 100;
        }

        .fab:hover {
            transform: scale(1.1);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--room-border);
            width: 90%;
            max-width: 400px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .modal-title {
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--room-border);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edit-btn {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            border: 1px solid var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .edit-btn:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }

        /* Forms & Lists */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(20, 25, 45, 0.8);
            border: 1px solid var(--room-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            height: 80px;
        }
        
        .color-options {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .color-radio {
            display: none;
        }
        .color-label {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
        }
        .color-radio:checked + .color-label {
            opacity: 1;
            border-color: white;
            box-shadow: 0 0 8px currentColor;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            margin-top: 10px;
        }
        button.submit-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        button.delete-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        button.delete-btn:hover {
            background: var(--accent-red);
            color: var(--bg-color);
        }

        .char-list-item {
            padding: 12px;
            border-bottom: 1px solid var(--room-border);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .char-list-item:hover {
            background: rgba(194, 168, 120, 0.1);
        }
        .char-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .char-detail p {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .back-btn {
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: inline-block;
        }
        .back-btn:hover { color: var(--text-main); }
        
    </style>
</head>
<body>

    <header>
        <h1 id="school-name" contenteditable="true" spellcheck="false" title="クリックして学校名を編集">私立ノスタルヂア学園</h1>
        <div class="floor-selector">
            <select id="floor-select">
                <option value="5F">5F</option>
                <option value="4F">4F</option>
                <option value="3F">3F</option>
                <option value="2F">2F</option>
                <option value="1F" selected>1F</option>
                <option value="B1">B1</option>
            </select>
        </div>
    </header>

    <div class="map-wrapper">
        <div class="map-container" id="map-container">
            </div>
    </div>

    <div class="fab" onclick="openModal('add-modal')">＋</div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('add-modal')">✖</span>
            <div class="modal-title">生徒・存在を登録</div>
            <div class="form-group">
                <label>名前</label>
                <input type="text" id="char-name" placeholder="例: 夕霧 花子">
            </div>
            <div class="form-group">
                <label>配属場所</label>
                <select id="char-room"></select>
            </div>
            <div class="form-group">
                <label>魂の色 (オーラ)</label>
                <div class="color-options">
                    <label><input type="radio" name="char-color" value="#c2a878" class="color-radio" checked><div class="color-label" style="background:#c2a878; color:#c2a878;"></div></label>
                    <label><input type="radio" name="char-color" value="#789bc2" class="color-radio"><div class="color-label" style="background:#789bc2; color:#789bc2;"></div></label>
                    <label><input type="radio" name="char-color" value="#c27878" class="color-radio"><div class="color-label" style="background:#c27878; color:#c27878;"></div></label>
                    <label><input type="radio" name="char-color" value="#6a4c93" class="color-radio"><div class="color-label" style="background:#6a4c93; color:#6a4c93;"></div></label>
                    <label><input type="radio" name="char-color" value="#78c28a" class="color-radio"><div class="color-label" style="background:#78c28a; color:#78c28a;"></div></label>
                </div>
            </div>
            <div class="form-group">
                <label>詳細・設定</label>
                <textarea id="char-info" placeholder="夕暮れ時にだけ音楽室に現れる...など"></textarea>
            </div>
            <button class="submit-btn" onclick="addCharacter()">登録する</button>
        </div>
    </div>

    <div class="modal-overlay" id="room-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('room-modal')">✖</span>
            <div class="modal-title">
                <span id="room-modal-title">1年1組</span>
                <span class="edit-btn" onclick="editRoomName()">名前変更</span>
            </div>
            <div id="room-char-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="detail-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('detail-modal')">✖</span>
            <div class="back-btn" onclick="backToRoomModal()">← 一覧に戻る</div>
            <div class="modal-title" id="detail-name" style="border-bottom:none; margin-bottom:5px;">名前</div>
            <div class="char-detail">
                <p style="color: var(--text-muted); font-size: 0.8rem; border-bottom: 1px solid var(--room-border); padding-bottom: 15px;" id="detail-class">所属</p>
                <p id="detail-info" style="margin-top: 15px; white-space: pre-wrap;">詳細テキスト</p>
            </div>
            <button class="delete-btn" onclick="deleteCharacter()">この存在を消去する</button>
        </div>
    </div>

    <script>
        // --- データ定義 (レイアウトを上下段に分割し、6マス単位で管理) ---
        // null は空きスペース（廊下や階段等の表現用）
        const floorData = {
            '5F': { 
                top: [{ id: 'roof', name: '屋上', type: 'special' }, null, null, null, null, null], 
                bottom: [null, null, null, null, null, null] 
            },
            '4F': {
                top: [{ id: '4-1', name: '四年1組' }, { id: '4-2', name: '四年2組' }, { id: '4-3', name: '四年3組' }, { id: '4-4', name: '四年4組' }, null, null],
                bottom: [null, null, null, null, { id: 'art', name: '美術室', type: 'special' }, { id: 'music', name: '音楽室', type: 'special' }]
            },
            '3F': {
                top: [{ id: '3-1', name: '三年1組' }, { id: '3-2', name: '三年2組' }, { id: '3-3', name: '三年3組' }, { id: '3-4', name: '三年4組' }, { id: '3-5', name: '三年5組' }, { id: '3-6', name: '三年6組' }],
                bottom: [null, null, null, null, null, null]
            },
            '2F': {
                top: [{ id: '2-1', name: '二年1組' }, { id: '2-2', name: '二年2組' }, { id: '2-3', name: '二年3組' }, { id: '2-4', name: '二年4組' }, { id: '2-5', name: '二年5組' }, { id: '2-6', name: '二年6組' }],
                bottom: [null, null, null, null, null, null]
            },
            '1F': {
                top: [{ id: '1-1', name: '一年1組' }, { id: '1-2', name: '一年2組' }, { id: '1-3', name: '一年3組' }, { id: '1-4', name: '一年4組' }, { id: '1-5', name: '一年5組' }, { id: '1-6', name: '一年6組' }],
                bottom: [{ id: 'entrance', name: '玄関ホール', type: 'special' }, { id: 'office', name: '事務室' }, { id: 'staff', name: '職員室' }, { id: 'principal', name: '校長室' }, { id: 'nurse', name: '保健室' }, null]
            },
            'B1': {
                top: [null, null, { id: 'storage', name: '地下倉庫', type: 'special' }, { id: 'boiler', name: 'ボイラー室' }, null, null],
                bottom: [null, null, null, null, null, null]
            }
        };

        let characters = [];
        let currentFloor = '1F';
        let currentRoomIdForModal = null; 
        let currentEditingCharId = null; // 削除対象の一時記憶

        // --- 初期化処理 ---
        window.onload = () => {
            initRoomSelectOptions();
            renderMap();
            setInterval(moveWisps, 4000);
        };

        document.getElementById('floor-select').addEventListener('change', (e) => {
            currentFloor = e.target.value;
            renderMap();
        });

        // --- 学校名の保存処理 (Enterキーでフォーカスを外す) ---
        document.getElementById('school-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                this.blur();
            }
        });

        // --- マップの描画 ---
        function renderMap() {
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            
            const layout = floorData[currentFloor];
            
            // 上段の教室を描画
            layout.top.forEach(room => container.appendChild(createRoomElement(room)));
            
            // 中央の廊下を描画
            const hallway = document.createElement('div');
            hallway.className = 'hallway';
            hallway.innerText = '廊下';
            container.appendChild(hallway);

            // 下段の教室を描画
            layout.bottom.forEach(room => container.appendChild(createRoomElement(room)));

            renderWisps();
        }

        function createRoomElement(room) {
            const el = document.createElement('div');
            if (!room) {
                el.className = 'room empty';
                return el;
            }

            el.className = `room ${room.type || ''}`;
            el.onclick = () => openRoomModal(room.id, room.name);
            
            const count = characters.filter(c => c.roomId === room.id).length;
            
            el.innerHTML = `
                <div class="room-name">${room.name}</div>
                ${count > 0 ? `<div class="char-count">◆ ${count}名</div>` : ''}
            `;
            return el;
        }

        // --- フォームのセレクトボックス初期化 ---
        function initRoomSelectOptions() {
            const select = document.getElementById('char-room');
            select.innerHTML = '';
            Object.keys(floorData).forEach(floor => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = floor;
                
                const allRooms = [...floorData[floor].top, ...floorData[floor].bottom];
                allRooms.forEach(room => {
                    if (room) {
                        const option = document.createElement('option');
                        option.value = room.id;
                        option.dataset.floor = floor;
                        option.innerText = room.name;
                        optgroup.appendChild(option);
                    }
                });
                if (optgroup.children.length > 0) select.appendChild(optgroup);
            });
        }

        // --- 教室名の編集 ---
        function editRoomName() {
            if (!currentRoomIdForModal) return;
            
            const newName = prompt('新しい教室名を入力してください:', currentRoomIdForModal.name);
            if (newName && newName.trim() !== '') {
                // データを更新
                const allFloors = Object.keys(floorData);
                for (let floor of allFloors) {
                    const topRoom = floorData[floor].top.find(r => r && r.id === currentRoomIdForModal.id);
                    if (topRoom) topRoom.name = newName.trim();
                    
                    const bottomRoom = floorData[floor].bottom.find(r => r && r.id === currentRoomIdForModal.id);
                    if (bottomRoom) bottomRoom.name = newName.trim();
                }

                currentRoomIdForModal.name = newName.trim();
                document.getElementById('room-modal-title').innerText = currentRoomIdForModal.name;
                
                initRoomSelectOptions();
                renderMap();
            }
        }

        // --- キャラクターの追加 ---
        function addCharacter() {
            const nameInput = document.getElementById('char-name').value.trim();
            const roomSelect = document.getElementById('char-room');
            const infoInput = document.getElementById('char-info').value.trim();
            const colorInput = document.querySelector('input[name="char-color"]:checked').value;
            
            if (!nameInput) {
                alert('名前を入力してください。');
                return;
            }

            const selectedOption = roomSelect.options[roomSelect.selectedIndex];
            
            const newChar = {
                id: Date.now().toString(),
                name: nameInput,
                roomId: selectedOption.value,
                floor: selectedOption.dataset.floor,
                color: colorInput,
                info: infoInput || '（詳細不明）'
            };

            characters.push(newChar);
            
            document.getElementById('char-name').value = '';
            document.getElementById('char-info').value = '';
            
            closeModal('add-modal');
            renderMap();
        }

        // --- キャラクターの削除 ---
        function deleteCharacter() {
            if (!currentEditingCharId) return;
            
            if (confirm('本当にこの存在をマップから消去しますか？')) {
                characters = characters.filter(c => c.id !== currentEditingCharId);
                closeModal('detail-modal');
                // 削除後は部屋一覧に戻る
                if (currentRoomIdForModal) {
                    openRoomModal(currentRoomIdForModal.id, currentRoomIdForModal.name);
                }
                renderMap();
            }
        }

        // --- モーダル制御 ---
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // 現在の部屋名を最新のデータから取得する補助関数
        function getRoomNameById(roomId) {
            for (let floor of Object.keys(floorData)) {
                const room = [...floorData[floor].top, ...floorData[floor].bottom].find(r => r && r.id === roomId);
                if (room) return room.name;
            }
            return '不明な部屋';
        }

        function openRoomModal(roomId, initialRoomName) {
            const roomName = getRoomNameById(roomId);
            currentRoomIdForModal = { id: roomId, name: roomName };
            document.getElementById('room-modal-title').innerText = roomName;
            
            const listContainer = document.getElementById('room-char-list');
            listContainer.innerHTML = '';

            const charsInRoom = characters.filter(c => c.roomId === roomId);
            
            if (charsInRoom.length === 0) {
                listContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem; text-align:center; padding: 20px 0;">誰もいないようだ...</p>';
            } else {
                charsInRoom.forEach(char => {
                    const div = document.createElement('div');
                    div.className = 'char-list-item';
                    div.innerHTML = `<div class="char-color-dot" style="background:${char.color}; box-shadow: 0 0 5px ${char.color}"></div><span>${char.name}</span>`;
                    div.onclick = () => openDetailModal(char);
                    listContainer.appendChild(div);
                });
            }

            openModal('room-modal');
        }

        function openDetailModal(char) {
            closeModal('room-modal');
            currentEditingCharId = char.id;
            
            const roomName = getRoomNameById(char.roomId);
            document.getElementById('detail-name').innerText = char.name;
            document.getElementById('detail-name').style.color = char.color;
            document.getElementById('detail-class').innerText = `[${char.floor}] ${roomName}`;
            document.getElementById('detail-info').innerText = char.info;
            
            openModal('detail-modal');
        }

        function backToRoomModal() {
            closeModal('detail-modal');
            if (currentRoomIdForModal) {
                openRoomModal(currentRoomIdForModal.id, currentRoomIdForModal.name);
            }
        }

        // --- アニメーション（名前付きの光の玉） ---
        function renderWisps() {
            const container = document.getElementById('map-container');
            document.querySelectorAll('.wisp-container').forEach(w => w.remove());

            const charsOnFloor = characters.filter(c => c.floor === currentFloor);
            
            charsOnFloor.forEach(char => {
                const wispContainer = document.createElement('div');
                wispContainer.className = 'wisp-container';
                wispContainer.dataset.id = char.id;
                
                // 初期位置
                wispContainer.style.top = (10 + Math.random() * 80) + '%';
                wispContainer.style.left = (10 + Math.random() * 80) + '%';
                
                wispContainer.innerHTML = `
                    <div class="wisp-name" style="color: ${char.color}">${char.name}</div>
                    <div class="wisp" style="background: ${char.color}; box-shadow: 0 0 10px 2px ${char.color};"></div>
                `;
                
                container.appendChild(wispContainer);
            });
        }

        function moveWisps() {
            const wisps = document.querySelectorAll('.wisp-container');
            wisps.forEach(wisp => {
                // 画面外に出ないように、10%〜90%の範囲でランダム移動
                wisp.style.top = (10 + Math.random() * 80) + '%';
                wisp.style.left = (10 + Math.random() * 80) + '%';
            });
        }
    </script>
</body>
</html>
