<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜の学校 — 完全マップ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080f;
  --bg2: #0e0e18;
  --bg3: #141420;
  --grid: #1a1a2e;
  --wall: #3a3a58;
  --wall-bright: #5a5a80;
  --text: #c8c4b8;
  --text-dim: #6a6660;
  --text-bright: #e8e4d8;
  --border: #2a2a40;

-c-safe:   #8aaecc;
-c-key:    #c9b46a;
-c-nature: #8cc99c;
-c-danger: #c97b7b;
-c-super:  #b08cc9;
-c-hidden: #7ac9c0;
-c-normal: #7a8898;
-c-empty:  #404858;
-c-ritual: #c9a07a;
-c-ygreen: #b8c96a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(–border) var(–bg)}
body{background:var(–bg);color:var(–text);font-family:‘Noto Serif JP’,serif;font-size:13px;line-height:1.8;min-height:100vh;overflow-x:hidden}
body::after{content:’’;position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(26,26,46,0.5) 39px,rgba(26,26,46,0.5) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(26,26,46,0.5) 39px,rgba(26,26,46,0.5) 40px);pointer-events:none;z-index:0;opacity:.4}

/* LAYOUT */
.app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh}

/* HEADER */
.hdr{padding:40px 32px 28px;border-bottom:1px solid var(–border);text-align:center;background:linear-gradient(to bottom,rgba(12,12,24,0.9),transparent)}
.hdr-sub{font-size:10px;letter-spacing:.35em;color:var(–text-dim);margin-bottom:14px}
.hdr h1{font-family:‘Shippori Mincho’,serif;font-size:clamp(18px,3vw,28px);font-weight:700;color:var(–text-bright);margin-bottom:8px}
.hdr p{font-size:11px;color:var(–text-dim);letter-spacing:.1em}

/* TABS */
.tabs-wrap{display:flex;gap:0;padding:0 32px;border-bottom:1px solid var(–border);background:var(–bg2);overflow-x:auto}
.tab{padding:12px 18px;font-size:11px;letter-spacing:.15em;color:var(–text-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s}
.tab:hover{color:var(–text)}
.tab.active{color:var(–c-key);border-bottom-color:var(–c-key)}
.tab-sep{padding:12px 6px;color:var(–border);font-size:10px;align-self:center}

/* MAIN */
.main{display:grid;grid-template-columns:1fr 280px;gap:0;height:calc(100vh - 180px);min-height:500px}
@media(max-width:768px){.main{grid-template-columns:1fr;grid-template-rows:1fr auto;height:auto}}

/* MAP CANVAS */
.canvas{position:relative;overflow:hidden;background:var(–bg);border-right:1px solid var(–border)}
.canvas svg{width:100%;height:100%;display:block}
.floor-label{position:absolute;top:14px;left:16px;font-size:10px;letter-spacing:.25em;color:var(–text-dim)}

/* TOOLTIP */
.room-tooltip{position:absolute;top:14px;right:14px;background:rgba(8,8,16,.95);border:1px solid var(–border);border-radius:3px;padding:14px 16px;max-width:220px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.room-tooltip.show{opacity:1}
.tt-name{font-family:‘Shippori Mincho’,serif;font-size:13px;font-weight:700;color:var(–text-bright);margin-bottom:4px}
.tt-src{font-size:9px;letter-spacing:.2em;margin-bottom:8px}
.tt-desc{font-size:11.5px;color:var(–text);line-height:1.7}

/* SIDE PANEL */
.side{background:var(–bg2);overflow-y:auto;display:flex;flex-direction:column}
.side-hdr{padding:16px 18px;border-bottom:1px solid var(–border);font-size:10px;letter-spacing:.25em;color:var(–text-dim)}
.side-content{padding:16px 18px;flex:1}
.side-room-name{font-family:‘Shippori Mincho’,serif;font-size:16px;font-weight:700;color:var(–text-bright);margin-bottom:4px}
.side-room-tag{display:inline-block;font-size:9px;letter-spacing:.15em;padding:2px 7px;border:1px solid;border-radius:2px;margin-bottom:10px}
.side-room-desc{font-size:12.5px;color:var(–text);line-height:1.8;margin-bottom:12px}
.side-quote{border-left:2px solid var(–border);padding:8px 12px;font-size:11.5px;color:var(–text-dim);font-style:italic;margin:10px 0}
.side-empty{color:var(–text-dim);font-size:12px;padding:20px 0}

/* LEGEND */
.legend{padding:14px 32px;border-top:1px solid var(–border);background:var(–bg2);display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.legend-title{font-size:10px;letter-spacing:.25em;color:var(–text-dim);margin-right:8px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(–text-dim)}
.leg-dot{width:10px;height:10px;border-radius:1px;flex-shrink:0}
.leg-line{width:20px;height:1px;flex-shrink:0}

/* SVG ROOM STYLES */
.room{cursor:pointer;transition:opacity .15s}
.room:hover .room-fill{opacity:.5!important}
.room:hover .room-stroke{stroke-width:1.5!important}
.room-label{pointer-events:none;font-family:‘Noto Serif JP’,serif}
.dim-label{fill:#4a4a60;font-size:8px;letter-spacing:.1em}

/* ANNOTATIONS */
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.story-marker{animation:pulse 3s ease-in-out infinite}

/* COMPASS */
.compass{position:absolute;bottom:16px;left:16px;opacity:.4}
</style>

</head>
<body>
<div class="app">

<!-- HEADER -->

<div class="hdr">
  <div class="hdr-sub">夜の学校 · 刺蛾結社通信 · 完全建物図解</div>
  <h1>夜の学校　完全マップ</h1>
  <p>両作品の記述を統合し、書かれていない部分を整合性に基づき補完した建物見取り図</p>
</div>

<!-- TABS -->

<div class="tabs-wrap">
  <div class="tab active" data-floor="campus">全体図</div>
  <div class="tab-sep">|</div>
  <div class="tab" data-floor="b1f">B1F</div>
  <div class="tab" data-floor="1f">1F</div>
  <div class="tab" data-floor="2f">2F</div>
  <div class="tab" data-floor="3f">3F</div>
  <div class="tab" data-floor="4f">4F</div>
  <div class="tab" data-floor="roof">屋上</div>
  <div class="tab-sep">|</div>
  <div class="tab" data-floor="b2">二号館</div>
  <div class="tab" data-floor="gym">体育館</div>
</div>

<!-- MAIN -->

<div class="main">
  <div class="canvas" id="canvas">
    <div class="floor-label" id="floorLabel">全体図</div>
    <svg id="mapSvg" viewBox="0 0 900 480" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="room-tooltip" id="tooltip">
      <div class="tt-name" id="tt-name"></div>
      <div class="tt-src" id="tt-src"></div>
      <div class="tt-desc" id="tt-desc"></div>
    </div>
  </div>
  <div class="side">
    <div class="side-hdr">ROOM INFO</div>
    <div class="side-content" id="sideContent">
      <div class="side-empty">部屋をクリックすると詳細が表示されます</div>
    </div>
  </div>
</div>

<!-- LEGEND -->

<div class="legend">
  <span class="legend-title">凡例</span>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-safe);opacity:.7"></div>安全・聖域</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-key);opacity:.7"></div>重要場面</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-nature);opacity:.7"></div>自然・生命</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-danger);opacity:.7"></div>危険・死隣接</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-super);opacity:.7"></div>超自然・怪異</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-hidden);opacity:.7"></div>隠秘・異空間</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-ritual);opacity:.7"></div>儀式・閾値</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-normal);opacity:.7"></div>通常室</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--c-empty);opacity:.7"></div>空室・未詳</div>
  <div class="leg-item"><div class="leg-line" style="background:var(--c-key);opacity:.6"></div>語り手の経路</div>
  <div class="leg-item" style="margin-left:12px;font-size:9px;color:var(--text-dim)">◆=作品1記述　★=作品2記述　◇=両作品　○=補完</div>
</div>

</div><!-- .app -->

// =====================================================
// RENDERING ENGINE
// =====================================================

let currentFloor = 'campus';
let selectedRoom = null;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function renderFloor(floorKey) {
  currentFloor = floorKey;
  const floor = floors[floorKey];
  if (!floor) return;

  const svg = document.getElementById('mapSvg');
  svg.setAttribute('viewBox', floor.viewBox);
  document.getElementById('floorLabel').textContent = floor.label;

  // Clear
  svg.innerHTML = '';

  // Grid background
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  // Background
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width','100%'); bg.setAttribute('height','100%');
  bg.setAttribute('fill','url(#grid)');
  svg.appendChild(bg);

  // Draw paths
  if (floor.paths) {
    floor.paths.forEach(p => {
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', p.d);
      path.setAttribute('stroke', p.color);
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('stroke-dasharray', p.dash || '');
      path.setAttribute('fill', 'none');
      path.setAttribute('opacity', '0.5');
      svg.appendChild(path);
    });
  }

  // Draw rooms
  floor.rooms.forEach(room => {
    const color = COLORS[room.color] || '#404858';
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','room');
    g.setAttribute('data-id', room.id);

    // Outer wall (special case)
    if (room.isOuter) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x', room.x); rect.setAttribute('y', room.y);
      rect.setAttribute('width', room.w); rect.setAttribute('height', room.h);
      rect.setAttribute('fill', 'rgba(20,20,32,0.8)');
      rect.setAttribute('stroke', '#3a3a58');
      rect.setAttribute('stroke-width', '2');
      svg.appendChild(rect);
      return;
    }

    // Room fill
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', room.x); rect.setAttribute('y', room.y);
    rect.setAttribute('width', room.w); rect.setAttribute('height', room.h);
    rect.setAttribute('fill', `rgba(${hexToRgb(color)},0.12)`);
    rect.setAttribute('stroke', color);
    rect.setAttribute('stroke-width', room.src === 'i' ? '0.5' : '1');
    rect.setAttribute('stroke-dasharray', room.src === 'i' ? '4,2' : '');
    rect.setAttribute('class', 'room-stroke');

    // Glow for important rooms
    if (room.src !== 'i' && room.src !== '') {
      rect.setAttribute('filter', room.color === 'key' || room.color === 'danger' || room.color === 'safe' ? 'url(#glow)' : '');
    }

    g.appendChild(rect);

    // Room label
    if (room.name && room.w > 30) {
      const lines = room.name.split('\n');
      const cy = room.y + room.h/2;
      const cx = room.x + room.w/2;
      const startY = lines.length > 1 ? cy - (lines.length-1)*6 : cy;

      lines.forEach((line, i) => {
        const text = document.createElementNS('http://www.w3.org/2000/svg','text');
        text.setAttribute('x', cx);
        text.setAttribute('y', startY + i*13 + 4);
        text.setAttribute('text-anchor','middle');
        text.setAttribute('dominant-baseline','middle');
        const fs = room.w < 70 ? 8 : room.w < 100 ? 9 : 10;
        text.setAttribute('font-size', fs);
        text.setAttribute('fill', room.src === 'i' ? '#4a4a60' : color);
        text.setAttribute('font-family','Noto Serif JP,serif');
        text.setAttribute('class','room-label');
        text.setAttribute('pointer-events','none');
        text.textContent = line;
        g.appendChild(text);
      });

      // Source badge
      if (room.src && room.src !== 'i' && room.w > 50 && room.h > 30) {
        const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
        badge.setAttribute('x', room.x + room.w - 4);
        badge.setAttribute('y', room.y + 10);
        badge.setAttribute('text-anchor','end');
        badge.setAttribute('font-size','7');
        badge.setAttribute('fill', SRC_LABELS[room.src]?.color || '#6a7a6a');
        badge.setAttribute('font-family','Noto Serif JP,serif');
        badge.setAttribute('pointer-events','none');
        badge.textContent = SRC_LABELS[room.src]?.label || '';
        g.appendChild(badge);
      }
    }

    // Click handler
    if (room.desc) {
      g.style.cursor = 'pointer';
      g.addEventListener('click', () => selectRoom(room));
    }

    svg.appendChild(g);
  });

  // North arrow
  const compass = document.createElementNS('http://www.w3.org/2000/svg','g');
  compass.setAttribute('transform','translate(860,20)');
  compass.setAttribute('opacity','0.3');
  const arrowPath = document.createElementNS('http://www.w3.org/2000/svg','path');
  arrowPath.setAttribute('d','M0,18 L-5,0 L0,6 L5,0 Z');
  arrowPath.setAttribute('fill','#8aaecc');
  const nLabel = document.createElementNS('http://www.w3.org/2000/svg','text');
  nLabel.setAttribute('x','0'); nLabel.setAttribute('y','28');
  nLabel.setAttribute('text-anchor','middle'); nLabel.setAttribute('font-size','9');
  nLabel.setAttribute('fill','#8aaecc'); nLabel.setAttribute('font-family','Noto Serif JP,serif');
  nLabel.textContent = 'N';
  compass.appendChild(arrowPath); compass.appendChild(nLabel);
  svg.appendChild(compass);
}

function selectRoom(room) {
  selectedRoom = room;
  const color = COLORS[room.color] || '#404858';
  const srcInfo = SRC_LABELS[room.src] || { label:'不明', color:'#6a7a6a' };

  const sideContent = document.getElementById('sideContent');
  let html = `
    <div class="side-room-name" style="color:${color}">${room.name.replace(/\n/g,'　')}</div>
    <div class="side-room-tag" style="color:${srcInfo.color};border-color:${srcInfo.color}">${srcInfo.label}</div>
    <div class="side-room-desc">${room.desc || ''}</div>
  `;
  if (room.quote) {
    html += `<div class="side-quote">「${room.quote}」</div>`;
  }
  sideContent.innerHTML = html;
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderFloor(tab.dataset.floor);
    document.getElementById('sideContent').innerHTML = '<div class="side-empty">部屋をクリックすると詳細が表示されます</div>';
  });
});

// Initial render
renderFloor('campus');
</script>
